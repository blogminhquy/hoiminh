name: CI

# Ba nhóm kiểm tra chạy SONG SONG trên ba máy, thời gian chờ bằng nhóm lâu nhất chứ không phải tổng:
#   static: kiểu (typecheck), lint, build giao diện.
#   test:   test đơn vị và tích hợp (vitest) của mọi gói.
#   e2e:    Playwright các luồng nghiệp vụ trên trình duyệt thật.
# Trước đây e2e chờ nhóm kiểm tra xong mới chạy, và typecheck, lint, test, build nối đuôi trên một máy: 8 đến 11 phút
# mỗi lượt. Một nhóm đỏ không chặn nhóm kia, nên một lượt chạy cho thấy trọn danh sách chỗ đỏ.
# Repo để private nên GitHub tính phút theo từng máy (làm tròn lên phút): giữ ba máy, không chia nhỏ hơn.
on:
  push:
    branches: [main]
  pull_request:

# Commit mới lên cùng một PR thì hủy lượt cũ đang chạy dở: lượt cũ kiểm một commit không còn ai merge.
# main không bao giờ bị hủy: mỗi commit lên main giữ trọn lượt kiểm của nó.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22

jobs:
  static:
    name: Kiểu, lint, build
    runs-on: ubuntu-latest
    # Bình thường khoảng 2 phút. Hạn này chỉ để một lượt kẹt không ngồi tới trần 6 tiếng của GitHub.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần đầu main (cha thứ nhất của commit merge thử) để so PR với main ở bước luật làm song song.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Chạy trước khi cài gói vì không cần gói nào và chỉ mất một giây: PR tự đặt số phiên bản, tự viết CHANGELOG,
      # thiếu phiếu thay đổi, hay migration xếp sai chỗ thì biết ngay. Ở PR, HEAD là commit merge thử của GitHub
      # (PR đã gộp main mới nhất) và HEAD^1 là đầu main. Luật ở CLAUDE.md, mục "Làm song song nhiều phiên".
      - name: Luật làm song song
        if: github.event_name == 'pull_request'
        run: node scripts/check-parallel.mjs --base HEAD^1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      # Lint trước vì chỉ mất khoảng 10 giây: lỗi dễ sửa nhất hiện ra sớm nhất.
      - run: pnpm lint
      - run: pnpm typecheck
      # Chỉ build giao diện. "build" của api và jobs là `tsc --noEmit`, trùng hẳn với typecheck ở trên.
      - run: pnpm --filter @hoiminh/web build

  test:
    name: Test đơn vị
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --only-shell: test chạy không màn hình nên chỉ cần bản headless, khỏi tải cả Chromium đầy đủ.
      # --with-deps cài thêm gói hệ thống qua apt. Máy chạy của GitHub đã có sẵn các thư viện trình duyệt cần, apt chỉ
      # thêm vài gói font phụ. Ngày 11/11/2026 kho gói Ubuntu của máy chạy không tới được suốt nhiều giờ, apt treo
      # 7 phút rồi làm đỏ cả job dù chưa chạy bài test nào. Vì vậy: cho apt tối đa 3 phút, không được thì tải riêng
      # trình duyệt (từ máy chủ của Playwright, không qua apt). Thiếu thư viện thật thì bước test sẽ báo rõ khi mở trình duyệt.
      - name: Cài trình duyệt cho e2e
        run: |
          if timeout 180 pnpm --filter @hoiminh/e2e exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Không cài được gói hệ thống qua apt, tải riêng trình duyệt và dùng thư viện có sẵn trên máy chạy."
          pnpm --filter @hoiminh/e2e exec playwright install --only-shell chromium
      - run: pnpm test:e2e
      # Khi đỏ: giữ báo cáo kèm ảnh chụp và trace để xem lại, khỏi phải chạy lại mới biết hỏng ở đâu.
      - name: Lưu báo cáo e2e khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bao-cao
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
