name: Deploy

# Mỗi lần đẩy lên main: kiểm tra, rồi deploy hai Worker.
#   hoiminh-api  (apps/api): giao diện + API ở hoiminh.com, www.hoiminh.com, api.hoiminh.com.
#   hoiminh-jobs (apps/jobs): cron và hàng đợi job. Deploy sau hoiminh-api vì hàng đợi chỉ có một nơi xử lý.
# Trước khi deploy, kiểm tra cả hai Worker đã có secret bắt buộc; thiếu thì dừng, web đang chạy giữ nguyên.
# hoiminh-api có hai chế độ theo biến RELEASE_MODE:
#   (mặc định) tự động: `wrangler deploy`, bản mới chạy ngay.
#   manual: `wrangler versions upload`, bản mới chỉ nằm chờ; super admin bấm "Cập nhật" ở /he-thong/phien-ban.
# Có thể chạy tay ở tab Actions, Deploy, Run workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22

jobs:
  check:
    name: Kiểm tra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  app:
    name: Worker hoiminh-api (web + API)
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Kiểm tra token Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN. Tạo token ở Cloudflare (My Profile, API Tokens, Edit Cloudflare Workers) rồi đặt ở GitHub, Settings, Secrets and variables, Actions."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra secret của hai Worker
        run: |
          infra/check-secrets.sh hoiminh-api
          infra/check-secrets.sh hoiminh-jobs
      - name: Build giao diện
        env:
          # Cố ý để trống, bỏ qua biến VITE_API_URL cũ của repo: web gọi API cùng tên miền.
          VITE_API_URL: ''
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://hoiminh.com' }}
        run: pnpm --filter @hoiminh/web build
      - name: Tạo bucket R2 (bỏ qua nếu đã có)
        run: pnpm --filter @hoiminh/api exec wrangler r2 bucket create hoiminh-files || echo "bucket đã có"
      - name: Deploy ngay
        if: vars.RELEASE_MODE != 'manual'
        run: pnpm --filter @hoiminh/api exec wrangler deploy
      - name: Tải bản mới lên, chờ admin phát hành
        if: vars.RELEASE_MODE == 'manual'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-${GITHUB_SHA::7}"
          MSG=$(printf '%s' "${COMMIT_MSG:-Chạy tay từ GitHub Actions}" | head -n1 | cut -c1-100)
          pnpm --filter @hoiminh/api exec wrangler versions upload --tag "$TAG" --message "$MSG"

  jobs:
    name: Worker hoiminh-jobs (cron + hàng đợi)
    needs: app
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hoiminh/jobs exec wrangler deploy
