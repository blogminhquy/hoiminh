name: Deploy

# Mỗi lần đẩy lên main: kiểm tra, build, rồi đưa web lên Cloudflare, và deploy Worker (API) nếu bật biến DEPLOY_API.
# Web có hai chế độ theo biến RELEASE_MODE:
#   (mặc định) tự động: `wrangler deploy`, bản mới chạy ngay.
#   manual: `wrangler versions upload`, bản mới chỉ nằm chờ; super admin bấm "Cập nhật" ở /he-thong/phien-ban.
# Có thể chạy tay ở tab Actions, Deploy, Run workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22

jobs:
  check:
    name: Kiểm tra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  web:
    name: Worker (web)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Kiểm tra secret Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN. Tạo token ở Cloudflare (My Profile → API Tokens → Edit Cloudflare Workers) rồi chạy: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.hoiminh.com' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://hoiminh.com' }}
        run: pnpm --filter @hoiminh/web build
      - name: Deploy Worker web
        if: vars.RELEASE_MODE != 'manual'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hoiminh/web exec wrangler deploy
      - name: Tải bản web lên, chờ admin phát hành
        if: vars.RELEASE_MODE == 'manual'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-${GITHUB_SHA::7}"
          MSG=$(printf '%s' "${COMMIT_MSG:-Chạy tay từ GitHub Actions}" | head -n1 | cut -c1-100)
          pnpm --filter @hoiminh/web exec wrangler versions upload --tag "$TAG" --message "$MSG"

  api:
    name: Worker (API)
    needs: check
    if: vars.DEPLOY_API == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tạo bucket R2 (bỏ qua nếu đã có)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hoiminh/api exec wrangler r2 bucket create hoiminh-files || echo "bucket đã có"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hoiminh/api exec wrangler deploy
