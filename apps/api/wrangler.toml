# Worker hoiminh-api: phục vụ cả giao diện (apps/web/dist) lẫn API cho Hội Mình.
# Tên giữ là "hoiminh-api" để không mất các secret đã đặt; secrets đặt bằng `wrangler secret put <TÊN>`.
# Cron và hàng đợi job chạy ở Worker riêng hoiminh-jobs (apps/jobs/wrangler.toml).
name = "hoiminh-api"
main = "src/worker.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"
APP_URL = "https://hoiminh.com"
API_URL = "https://api.hoiminh.com"
AUTH_PROVIDER = "local"
SEPAY_MODE = "production"
MOMO_MODE = "production"
VNPAY_MODE = "sandbox"
PAYPAL_MODE = "sandbox"
R2_BUCKET = "hoiminh-files"
LOG_LEVEL = "info"

# Giao diện: build trước bằng `pnpm --filter @hoiminh/web build`. Cloudflare trả file tĩnh thẳng, không chạy code
# (không tính phí request); đường dẫn không khớp tệp nào trả index.html (ứng dụng một trang, react-router).
# Chỉ các đường dẫn dưới đây mới chạy Worker. Thêm route API mới ở tiền tố khác thì phải thêm vào đây.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/webhooks/*", "/pay/*", "/r/*", "/files/*", "/health"]

# Tên miền riêng: Cloudflare tự tạo bản ghi DNS khi deploy.
# api.hoiminh.com giữ lại vì cổng thanh toán gửi webhook về đó và API key của chủ hội đang dùng nó.
[[routes]]
pattern = "hoiminh.com"
custom_domain = true

[[routes]]
pattern = "www.hoiminh.com"
custom_domain = true

[[routes]]
pattern = "api.hoiminh.com"
custom_domain = true

# Hyperdrive: gộp kết nối Postgres phía Cloudflare (Workers không cho dùng lại socket giữa các request).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f4c98cf06b33403caab8d1a68e89ab0a"

# Chỉ gửi job vào hàng đợi; hoiminh-jobs là nơi xử lý.
[[queues.producers]]
queue = "hoiminh-jobs"
binding = "JOBS"

[observability]
enabled = true

# Secrets cần đặt (Worker hoiminh-jobs cần cùng bộ này, xem README mục "Hai Worker"):
#   DATABASE_URL, DATABASE_DIRECT_URL, AUTH_JWT_SECRET, ENCRYPTION_KEY, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   SUPABASE_JWT_SECRET, RESEND_API_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_PUBLIC_BASE_URL, SEPAY_API_KEY, SEPAY_BANK_ACCOUNT, MOMO_PARTNER_CODE, MOMO_ACCESS_KEY, MOMO_SECRET_KEY,
#   VNPAY_TMN_CODE, VNPAY_HASH_SECRET, PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID,
#   CF_RELEASE_API_TOKEN, CF_RELEASE_ACCOUNT_ID (chỉ hoiminh-api, cho nút Cập nhật ở /he-thong/phien-ban)
