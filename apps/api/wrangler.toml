# Worker hoiminh-api: phục vụ cả giao diện (apps/web/dist) lẫn API cho Hội Mình.
# Tên giữ là "hoiminh-api" để không mất các secret đã đặt; secrets đặt bằng `wrangler secret put <TÊN>`.
# Cron và hàng đợi job chạy ở Worker riêng hoiminh-jobs (apps/jobs/wrangler.toml).
name = "hoiminh-api"
main = "src/worker.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"
APP_URL = "https://hoiminh.com"
API_URL = "https://api.hoiminh.com"
AUTH_PROVIDER = "local"
SEPAY_MODE = "production"
MOMO_MODE = "production"
VNPAY_MODE = "sandbox"
PAYPAL_MODE = "sandbox"
R2_BUCKET = "hoiminh-files"
EMAIL_FROM = "Hội Mình <no-reply@hoiminh.com>"
LOG_LEVEL = "info"

# Giao diện: build trước bằng `pnpm --filter @hoiminh/web build`. Cloudflare trả file tĩnh thẳng, không chạy code
# (không tính phí request); đường dẫn không khớp tệp nào trả index.html (ứng dụng một trang, react-router).
# Chỉ các đường dẫn dưới đây mới chạy Worker. Thêm route API mới ở tiền tố khác thì phải thêm vào đây.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/webhooks/*", "/pay/*", "/r/*", "/files/*", "/health"]

# Tên miền riêng: Cloudflare tự tạo bản ghi DNS khi deploy.
# api.hoiminh.com giữ lại vì cổng thanh toán gửi webhook về đó và API key của chủ hội đang dùng nó.
[[routes]]
pattern = "hoiminh.com"
custom_domain = true

[[routes]]
pattern = "www.hoiminh.com"
custom_domain = true

[[routes]]
pattern = "api.hoiminh.com"
custom_domain = true

# Chạy Worker ở trung tâm dữ liệu Cloudflare gần cơ sở dữ liệu nhất (Supabase đặt tại AWS Singapore, ap-southeast-1,
# chuyển từ Seoul ngày 10/11/2026 để gần người dùng Việt Nam hơn).
# Mỗi request của người đăng nhập đi về database vài chục lượt; nếu Worker chạy ở điểm gần người dùng (Việt Nam) thì
# mỗi lượt mất cả quãng Việt Nam tới database, một lượt gọi API thành 1 đến 3 giây. Đặt Worker cạnh database thì người dùng
# chỉ chịu quãng đường xa đúng một lần cho mỗi request. Chỉ ảnh hưởng handler fetch: tệp giao diện vẫn phát từ điểm
# gần người dùng. Đổi vùng của database thì phải sửa dòng này theo (kiểm bằng header cf-placement của /health).
[placement]
region = "aws:ap-southeast-1"

# Hyperdrive: gộp kết nối Postgres phía Cloudflare (Workers không cho dùng lại socket giữa các request).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f4c98cf06b33403caab8d1a68e89ab0a"

# R2: ảnh và tệp. Binding này là đủ để tải tệp chạy, không cần R2_ACCESS_KEY_*; bucket được tạo
# trong workflow deploy (`wrangler r2 bucket create hoiminh-files`). Muốn phát ảnh public qua CDN thay
# vì qua API thì gắn domain cho bucket rồi đặt R2_PUBLIC_BASE_URL.
[[r2_buckets]]
binding = "FILES"
bucket_name = "hoiminh-files"

# Cloudflare Images: ảnh JPEG/PNG tải lên được chuyển sang WebP (cạnh dài tối đa 1200px, avatar 512px) trước khi
# ghi vào R2. Đây là lưới an toàn cuối: trình duyệt đã tự đổi sang WebP trước khi gửi (Safari dùng bộ mã hóa WebAssembly
# của web, apps/web/src/lib/webp-encoder.ts), ảnh đã là WebP thì không tốn lượt chuyển đổi nào.
# Gói Images miễn phí cho 5.000 lượt chuyển đổi mỗi tháng; hết lượt thì ảnh lưu nguyên dạng JPEG, không lỗi.
[images]
binding = "IMAGES"

# Chỉ gửi job vào hàng đợi; hoiminh-jobs là nơi xử lý.
[[queues.producers]]
queue = "hoiminh-jobs"
binding = "JOBS"

# Giới hạn số lần gọi, đếm chung trên toàn Cloudflare (apps/api/src/middleware/rate-limit.ts).
# `limit`/`period` phải khớp TIERS trong code; period chỉ nhận 10 hoặc 60 giây. namespace_id là số tùy chọn, duy nhất trong account.
[[ratelimits]]
name = "RL_API"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_WEBHOOK"
namespace_id = "1004"
simple = { limit = 1200, period = 60 }

# Không chạy cron ở đây (cron ở hoiminh-jobs). Phải ghi rõ danh sách rỗng: thiếu mục này thì wrangler
# giữ nguyên lịch cron cũ của Worker, và bản trước khi tách vẫn đang có 3 lịch cron.
[triggers]
crons = []

# Durable Object giữ WebSocket thời gian thực, mỗi người dùng một hub (apps/api/src/realtime-hub.ts).
# Migration tạo class: chỉ áp được bằng `wrangler deploy`, không qua `wrangler versions upload` (RELEASE_MODE=manual).
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1-realtime"
new_sqlite_classes = ["RealtimeHub"]

[observability]
enabled = true

# Tùy chọn: R2_PUBLIC_BASE_URL (domain public của bucket), hoặc R2_ACCOUNT_ID + R2_ACCESS_KEY_ID +
# R2_SECRET_ACCESS_KEY để trình duyệt tải thẳng lên R2 qua S3 thay vì đi qua API.
# Secrets cần đặt (chỉ ở Worker này; hoiminh-jobs đọc lại qua entrypoint SharedEnv, xem README mục "Hai Worker"):
#   DATABASE_URL, DATABASE_DIRECT_URL, AUTH_JWT_SECRET, ENCRYPTION_KEY, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   SUPABASE_JWT_SECRET, RESEND_API_KEY, SEPAY_API_KEY, SEPAY_BANK_ACCOUNT, MOMO_PARTNER_CODE, MOMO_ACCESS_KEY, MOMO_SECRET_KEY,
#   VNPAY_TMN_CODE, VNPAY_HASH_SECRET, PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID,
#   CF_RELEASE_API_TOKEN, CF_RELEASE_ACCOUNT_ID (chỉ hoiminh-api, cho nút Cập nhật ở /he-thong/phien-ban)
#   YOUTUBE_API_KEY (tùy chọn, chỉ hoiminh-api): có thì nhập bài từ link YouTube lấy chắc chắn cả mô tả và thời lượng
