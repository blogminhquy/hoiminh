# Worker hoiminh-jobs: cron và hàng đợi job của Hội Mình, tách khỏi Worker phục vụ người dùng (hoiminh-api)
# để việc nặng (giải phóng hoa hồng, gửi email hàng loạt, retry webhook) không làm chậm trang web.
# Không cần đặt secret: Worker này đọc secret của hoiminh-api qua binding SHARED_ENV bên dưới.
# Secret đặt riêng ở đây (nếu có) sẽ được ưu tiên hơn.
name = "hoiminh-jobs"
main = "src/worker.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
# Không có tên miền, không nhận request từ Internet.
workers_dev = false

[vars]
APP_ENV = "production"
APP_URL = "https://hoiminh.com"
API_URL = "https://api.hoiminh.com"
AUTH_PROVIDER = "local"
SEPAY_MODE = "production"
MOMO_MODE = "production"
VNPAY_MODE = "sandbox"
PAYPAL_MODE = "sandbox"
R2_BUCKET = "hoiminh-files"
EMAIL_FROM = "Hội Mình <no-reply@hoiminh.com>"
LOG_LEVEL = "info"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f4c98cf06b33403caab8d1a68e89ab0a"

# Job dọn tệp và gửi email kèm tệp cần đọc cùng bucket với hoiminh-api.
[[r2_buckets]]
binding = "FILES"
bucket_name = "hoiminh-files"

# Secret dùng chung: gọi entrypoint SharedEnv của hoiminh-api (apps/api/src/worker.ts), kênh nội bộ Cloudflare.
# hoiminh-api phải deploy trước Worker này (workflow deploy đã theo thứ tự đó).
[[services]]
binding = "SHARED_ENV"
service = "hoiminh-api"
entrypoint = "SharedEnv"

# Job có thể sinh job mới (vd. gửi email sau khi xử lý), nên vẫn cần quyền gửi vào hàng đợi.
[[queues.producers]]
queue = "hoiminh-jobs"
binding = "JOBS"

[[queues.consumers]]
queue = "hoiminh-jobs"
max_batch_size = 10
max_retries = 5
# Trần số consumer chạy đồng thời: mỗi consumer mở một kết nối Postgres qua Hyperdrive, nghẽn khi đông người là DB.
# Tăng dần theo số đo (p95 truy vấn, độ sâu hàng đợi), đừng bỏ trống để Queue tự nở tới mức tối đa.
max_concurrency = 10
dead_letter_queue = "hoiminh-jobs-dlq"

# Job hết lượt retry: ghi log `job.dead_letter` để cảnh báo và đánh dấu dòng scheduled_jobs là failed.
[[queues.consumers]]
queue = "hoiminh-jobs-dlq"
max_batch_size = 10
max_retries = 0

[triggers]
# Không còn cron mỗi phút: việc nền chạy theo sự kiện (Queue, delay ≤ 24 giờ). Cron chỉ là lưới an toàn.
# 10 phút: snapshot xếp hạng affiliate + bộ quét thưa (đẩy job hẹn giờ sắp tới hạn, cứu tin mất, dọn cờ hết hạn đơn/trạng thái sự kiện)
# 18:00 UTC = 01:00 giờ Việt Nam: giải phóng hoa hồng, churn, gói nền tảng, dọn bảng job, đối soát nhắc sự kiện
crons = ["*/10 * * * *", "0 18 * * *"]

# Thông báo tạo từ cron và job (nhắc sự kiện, hoa hồng...) cũng được đẩy tới trình duyệt ngay.
# Class RealtimeHub nằm ở Worker hoiminh-api, nên phải deploy hoiminh-api trước.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"
script_name = "hoiminh-api"

[observability]
enabled = true
