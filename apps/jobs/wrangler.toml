# Worker hoiminh-jobs: cron và hàng đợi job của Hội Mình, tách khỏi Worker phục vụ người dùng (hoiminh-api)
# để việc nặng (giải phóng hoa hồng, gửi email hàng loạt, retry webhook) không làm chậm trang web.
# Không cần đặt secret: Worker này đọc secret của hoiminh-api qua binding SHARED_ENV bên dưới.
# Secret đặt riêng ở đây (nếu có) sẽ được ưu tiên hơn.
name = "hoiminh-jobs"
main = "src/worker.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
# Không có tên miền, không nhận request từ Internet.
workers_dev = false

[vars]
APP_ENV = "production"
APP_URL = "https://hoiminh.com"
API_URL = "https://api.hoiminh.com"
AUTH_PROVIDER = "local"
SEPAY_MODE = "production"
MOMO_MODE = "production"
VNPAY_MODE = "sandbox"
PAYPAL_MODE = "sandbox"
R2_BUCKET = "hoiminh-files"
EMAIL_FROM = "Hội Mình <no-reply@hoiminh.com>"
LOG_LEVEL = "info"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f4c98cf06b33403caab8d1a68e89ab0a"

# Job dọn tệp và gửi email kèm tệp cần đọc cùng bucket với hoiminh-api.
[[r2_buckets]]
binding = "FILES"
bucket_name = "hoiminh-files"

# Secret dùng chung: gọi entrypoint SharedEnv của hoiminh-api (apps/api/src/worker.ts), kênh nội bộ Cloudflare.
# hoiminh-api phải deploy trước Worker này (workflow deploy đã theo thứ tự đó).
[[services]]
binding = "SHARED_ENV"
service = "hoiminh-api"
entrypoint = "SharedEnv"

# Job có thể sinh job mới (vd. gửi email sau khi xử lý), nên vẫn cần quyền gửi vào hàng đợi.
[[queues.producers]]
queue = "hoiminh-jobs"
binding = "JOBS"

[[queues.consumers]]
queue = "hoiminh-jobs"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "hoiminh-jobs-dlq"

[triggers]
# mỗi phút: job hẹn giờ, nhắc sự kiện, hết hạn đơn, retry webhook
# 10 phút: snapshot xếp hạng cộng sự
# 18:00 UTC = 01:00 giờ Việt Nam: giải phóng hoa hồng, churn, gói nền tảng
crons = ["* * * * *", "*/10 * * * *", "0 18 * * *"]

[observability]
enabled = true
