<ellipse cx="98" cy="160" rx="13" ry="11" fill="#FFF6EA" stroke="#3B2A20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><g class="pump" style="transform-origin:160px 148px"><path d="M158 142 L200 98" stroke="#3B2A20" stroke-width="22" stroke-linecap="round"/><path d="M158 142 L200 98" stroke="#FFF6EA" stroke-width="12" stroke-linecap="round"/><circle cx="204" cy="92" r="15" fill="#FFF6EA" stroke="#3B2A20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M196 88 L212 88 M196 95 L212 95" stroke="#3B2A20" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
</g>
</g>
</svg>
