  <path d="M169 60 L166 36 L145 50 Z" fill="#FF9AA2"/>
  <clipPath id="hc"><ellipse cx="120" cy="98" rx="72" ry="60"/></clipPath>
  <ellipse cx="120" cy="98" rx="72" ry="60" fill="#FFF6EA"/>
  <g clip-path="url(#hc)">
    <path d="M82 38 Q120 22 158 38 Q148 62 132 58 Q120 70 108 58 Q92 62 82 38 Z" fill="#F5A04A"/>
    <path d="M42 90 Q58 84 66 96 Q56 106 42 104 Z" fill="#F5A04A"/>
  </g>
  <ellipse cx="120" cy="98" rx="72" ry="60" fill="none" stroke="#3B2A20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M112 40 L114 54 M120 38 L120 54 M128 40 L126 54" stroke="#3B2A20" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
  <path d="M46 112 L72 116 M46 124 L72 122 M194 112 L168 116 M194 124 L168 122" stroke="#3B2A20" stroke-width="3" stroke-linecap="round" opacity=".6"/>
<path d="M104 46 L120 2 L136 46 Z" fill="#C77DFF" stroke="#3B2A20" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 30 L130 30 M114 18 L126 18" stroke="#FFC531" stroke-width="4"/><circle cx="120" cy="4" r="6" fill="#FFC531" stroke="#3B2A20" stroke-width="3"/>
<ellipse cx="80" cy="116" rx="12" ry="7" fill="#FF9AA2" opacity="0.75"/><ellipse cx="160" cy="116" rx="12" ry="7" fill="#FF9AA2" opacity="0.75"/>
<path d="M84 100 Q95 84 106 100 M134 100 Q145 84 156 100" fill="none" stroke="#3B2A20" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M114 108 L126 108 L120 115 Z" fill="#FF9AA2" stroke="#3B2A20" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M100 118 Q120 154 140 118 Z" fill="#8B2E2E" stroke="#3B2A20" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M108 136 Q120 128 132 136 Q120 148 108 136 Z" fill="#FF9AA2"/>
<g class="cheer-l" style="transform-origin:80px 140px"><path d="M80 140 L42 74" stroke="#3B2A20" stroke-width="22" stroke-linecap="round"/><path d="M80 140 L42 74" stroke="#FFF6EA" stroke-width="12" stroke-linecap="round"/><ellipse cx="38" cy="68" rx="14" ry="12" fill="#FFF6EA" stroke="#3B2A20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g><g class="cheer-r" style="transform-origin:160px 140px"><path d="M160 140 L198 74" stroke="#3B2A20" stroke-width="22" stroke-linecap="round"/><path d="M160 140 L198 74" stroke="#FFF6EA" stroke-width="12" stroke-linecap="round"/><ellipse cx="202" cy="68" rx="14" ry="12" fill="#FFF6EA" stroke="#3B2A20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
</g>
</g>
</svg>
