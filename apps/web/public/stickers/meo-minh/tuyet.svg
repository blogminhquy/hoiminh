  <ellipse cx="120" cy="152" rx="50" ry="36" fill="#FFF6EA" stroke="#3B2A20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="120" cy="160" rx="26" ry="18" fill="#FFFFFF" opacity=".85"/>
